services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mymealprep
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mymealprep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymealprep"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://mymealprep:secret@postgres:5432/mymealprep?sslmode=disable
      JWT_SECRET: dev-secret-change-in-prod
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
